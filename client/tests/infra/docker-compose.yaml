services:
  # ---------------------------------------------------------------------------
  # NGINX REVERSE PROXY (Zentraler Einstiegspunkt auf Port 80)
  # ---------------------------------------------------------------------------
  gateway:
    image: nginx:alpine
    container_name: tcc-dev-gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      keycloak_net:
        aliases:
          - auth.tcc.local  # <-- ÄNDERUNG: Internes DNS-Routing für das Gateway
      api_net:
        aliases:
          - auth.tcc.local  # <-- ÄNDERUNG: Auch im API-Netzwerk auflösbar

  # ---------------------------------------------------------------------------
  # POSTGRES FÜR KEYCLOAK
  # ---------------------------------------------------------------------------
  postgres-keycloak:
    image: postgres:18-alpine
    container_name: tcc-dev-keycloak-postgres
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password123}
    volumes:
      - postgres_keycloak_data:/var/lib/postgresql
    networks:
      - keycloak_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d keycloak_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ---------------------------------------------------------------------------
  # POSTGRES FÜR RUST API
  # ---------------------------------------------------------------------------
  postgres-api:
    image: postgres:18-alpine
    container_name: tcc-dev-api-postgres
    environment:
      POSTGRES_DB: tcc_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_api_data:/var/lib/postgresql
    networks:
      - api_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d tcc_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ---------------------------------------------------------------------------
  # KEYCLOAK OIDC PROVIDER
  # ---------------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:26.6
    container_name: tcc-dev-keycloak
    command: start-dev --import-realm
    environment:
      KC_HTTP_PORT: 8081
      KC_HOSTNAME: http://auth.tcc.local/auth  # <-- ÄNDERUNG: Externe URL ist nun die lokale Dummy-Domain
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak_db
      KC_DB_USERNAME: ${POSTGRES_USER:-postgres}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-password123}
      KC_HEALTH_ENABLED: "true"
      KC_LOG_LEVEL: INFO
      TEST_USER_PASSWORD: ${TEST_USER_PASSWORD:-ChangeMe123!}
    volumes:
      - ./keycloak-realm.json:/opt/keycloak/data/import/realm.json:ro
    networks:
      - keycloak_net
    depends_on:
      postgres-keycloak:
        condition: service_healthy
    healthcheck:
      # <-- ÄNDERUNG im Healthcheck: Host Header auf auth.tcc.local angepasst
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\r\nHost: auth.tcc.local\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------------------
  # RUST API & FRONTEND (tcc-app)
  # ---------------------------------------------------------------------------
  tcc-app:
    image: tcc:latest
    container_name: tcc-dev-api
    environment:
      DATABASE_URL: postgres://postgres:password123@postgres-api:5432/tcc_db
      AUTH_DOMAIN: http://auth.tcc.local/auth  # <-- ÄNDERUNG: Die App nutzt nun die gleiche URL für internen Abruf & Token-Validierung
      AUTH_REALM: tcc-realm
      AUTH_AUDIENCE: http://localhost:3000/api # <-- BEACHTE: In deinem Fehler-Log stand exakt diese URL als "aud"-Claim im Token.
    networks:
      - keycloak_net
      - api_net
    depends_on:
      postgres-api:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      gateway:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/3000 && echo -e 'GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

# -----------------------------------------------------------------------------
# NETZWERKE UND VOLUMES
# -----------------------------------------------------------------------------
networks:
  keycloak_net:
    driver: bridge
  api_net:
    driver: bridge

volumes:
  postgres_keycloak_data:
  postgres_api_data: