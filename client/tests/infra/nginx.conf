server {
    listen 80;
    server_name localhost;

    # Docker internen DNS-Server angeben
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 1. Keycloak OIDC Provider
    location /auth/ {
        # Variablen erzwingen dynamisches DNS beim Request
        set $keycloak_upstream http://keycloak:8081;
        rewrite ^/auth/(.*) /$1 break;
        proxy_pass $keycloak_upstream;

        proxy_set_header Host localhost;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    # 2. Rust API Backend
    location /api/ {
        set $api_upstream http://tcc-app:3000;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass $api_upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Dioxus Frontend App
    location / {
        set $app_upstream http://tcc-app:3000;
        proxy_pass $app_upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}